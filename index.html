<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/dental-logo.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Preconnect for Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://maps.google.com" />

    <!-- Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet" />

    <!-- Basic SEO (will be enhanced by React Helmet) -->
    <title>
      Dr. Manasi's Manifest Dental Studio - Cosmetic Dentist & Root Canal
      Specialist
    </title>
    <meta
      name="description"
      content="Expert dental care by Dr. Manasi Surwade in Kharghar, Navi Mumbai. Specializing in cosmetic dentistry, root canal treatment, dental implants, and teeth whitening." />
    <meta
      name="keywords"
      content="dental clinic, cosmetic dentist, root canal specialist, dental implants, teeth whitening, Kharghar, Navi Mumbai, Dr. Manasi Surwade, Manifest Dental Studio" />
    <meta name="author" content="Dr. Manasi Surwade" />

    <!-- Basic Open Graph -->
    <meta property="og:type" content="website" />
    <meta
      property="og:site_name"
      content="Dr. Manasi's Manifest Dental Studio" />

    <!-- Basic Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#1e40af" />
    <meta name="msapplication-TileColor" content="#1e40af" />

    <!-- Mobile Optimization -->
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Manifest Dental" />

    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" href="/images/dental-logo.png" />
    <link
      rel="apple-touch-icon"
      sizes="152x152"
      href="/images/dental-logo.png" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/images/dental-logo.png" />
    <link
      rel="apple-touch-icon"
      sizes="167x167"
      href="/images/dental-logo.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
